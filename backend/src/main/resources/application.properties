server.port=8080
spring.application.name=rescue-stock
# 当前阶段数据在进程内仓库（InMemoryDataRepository），关闭 JPA/数据源自动装配；
# 接入 MySQL 时改为提供 spring.datasource.* 并移除下面两行即可。
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration
# 模型字段使用 camelCase，通过 Jackson 统一输出 snake_case，对齐前端类型
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
